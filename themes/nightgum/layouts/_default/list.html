{{ partial "head.html" . }}
<main class="posts section">
  <article class="post">
    <h1>{{ .Title }}</h1>
  </article>
  <ul class="posts">
    {{ range .Pages }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
    </li>
    {{ end }}
  </ul>
</main>
{{ partial "foot.html" . }}
