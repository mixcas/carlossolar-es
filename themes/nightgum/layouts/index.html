{{ partial "head.html" . }}
{{ partial "description.html" . }}
<main class="home section">
  <ul class="posts">
    {{ range site.RegularPages }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
    </li>
    {{ end }}
  </ul>
</main>
{{ partial "foot.html" . }}
